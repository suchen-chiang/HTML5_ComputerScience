<!DOCTYPE html>

<body class="min-h-screen flex flex-col">

  <!-- 標題列 -->
  <header class="bg-gradient-to-r from-cyan-600 to-blue-600 text-white">

      <p class="font-mono text-cyan-200 text-sm tracking-widest mb-2">HTML5 · COMPUTER SCIENCE</p>
      <h1 class="text-3xl sm:text-4xl font-black mb-3">計算機網絡語音互動教學動畫</h1>
      <p class="text-cyan-100 text-sm sm:text-base max-w-2xl mx-auto">
        互動式網頁動畫，搭配語音導覽，帶你一步步看懂協定欄位、封包結構與資料驗證。
      </p>
    </div>
  </header>

  <!-- 卡片區 -->
  <main class="flex-1">
    <div class="max-w-5xl mx-auto px-6 py-10 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">

      <!-- CH06 -->
      <a href="CH06_tcp_udp_checksum.html"
         class="group bg-white rounded-2xl shadow-sm hover:shadow-xl border border-slate-200 hover:-translate-y-1 transition-all duration-200 overflow-hidden flex flex-col">
        <div class="h-2 bg-cyan-500"></div>
        <div class="p-6 flex-1 flex flex-col">

          <h2 class="text-xl font-bold mb-2 group-hover:text-cyan-600 transition-colors">TCP/UDP 錯誤檢查碼</h2>
          <p class="text-slate-500 text-sm leading-relaxed flex-1">12 Bytes 涵蓋範圍切成 6 組 16-bit：動畫示範 Checksum 歸零、一補數加成到接收端驗證封包正確性。</p>
          <div class="mt-4 flex flex-wrap gap-1.5">
            <span class="text-xs font-medium px-2 py-0.5 rounded bg-slate-100 text-slate-600">Checksum</span>
            <span class="text-xs font-medium px-2 py-0.5 rounded bg-slate-100 text-slate-600">16-bit 一補數</span>
            <span class="text-xs font-medium px-2 py-0.5 rounded bg-slate-100 text-slate-600">封包結構</span>
          </div>
        </div>
        <div class="px-6 pb-5">
          <span class="inline-flex items-center gap-1 text-sm font-semibold text-cyan-600">開始學習
            <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7l5 5-5 5M6 12h12"/></svg>
          </span>
        </div>
      </a>

    </div>
